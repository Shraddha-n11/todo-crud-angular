<div class="row">
    <div class="col-12">
        <h1>{{isInEditMode ? 'Update Todo' : 'Add Todo'}}</h1>

    </div>
    <div class="col-md-6">
     <div class="form-group">
        <label for="todoItem">Todo Item</label>
        <input type="text" class="form-control" #todoName>
     </div>

    <button
    (click)="onAddTodo()"
     *ngIf="!isInEditMode"
      mat-raised-button color="primary">Add Todo</button>

    <button
    *ngIf="isInEditMode"
     mat-raised-button color="warning">Update Todo</button>
    </div>

    <div class="col-md-6">

    <ul class="list-group">

      <li
        class="list-group-item d-flex justify-content-between"
        *ngFor="let todo of todosArr">

        <strong>
          {{todo.todoItem}}  {{todo.todoId}}

        </strong>

        <div>

          <button
            mat-mini-fab
            color="primary"
            class="me-2">

            <mat-icon>edit</mat-icon>

          </button>

          <button
            mat-mini-fab
            color="warn">

            <mat-icon>delete</mat-icon>

          </button>

        </div>

      </li>

    </ul>

  </div>

</div>
